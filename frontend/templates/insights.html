<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insights | Estatify</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/insights.css') }}">
</head>
<body>
    <main class="page">
        <nav class="navbar">
            <a class="logo" href="/">Estatify</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/prediction">Prediction</a>
                <a href="/recommendations">Recommendation</a>
                <a href="/analytics">Analysis</a>
                <a class="active" href="/insights">Insights</a>
            </div>
        </nav>

        <section class="insight-shell">
            <section class="control-panel" aria-label="Insight controls">
                <div class="field">
                    <label for="categoryDropdown">Feature Category</label>
                    <select id="categoryDropdown">
                        <option value="numerical">Numerical Features</option>
                        <option value="categorical">Categorical Features</option>
                    </select>
                </div>
                <div class="field">
                    <label for="featureDropdown">Feature</label>
                    <select id="featureDropdown"></select>
                </div>
            </section>

            <div id="message" class="message"></div>
            <section id="insightCard" class="insight-card" aria-live="polite"></section>
        </section>

       <footer class="footer">
            <p>&copy; 2026 Estatify &bull; Developed by Megh Patel</p>

            <div class="footer-social">
                <a href="https://github.com/MeghOfficial/Real_Estate" target="_blank" aria-label="GitHub" rel="noopener">
                    <i class="fab fa-github"></i>
                </a>

                <a href="https://www.linkedin.com/in/megh-bavarva-588b78284/" target="_blank" aria-label="LinkedIn" rel="noopener">
                    <i class="fab fa-linkedin"></i>
                </a>

                <a href="mailto:bavarvamegh3139@gmail.com" aria-label="Email">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='js/insights.js') }}"></script>
</body>
</html>
